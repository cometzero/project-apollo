<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="04-domain-fabric-title 04-domain-fabric-desc" id="d-04-domain-fabric-root">
<title id="04-domain-fabric-title">QBox domain address views</title>
<desc id="04-domain-fabric-desc">각 Domain box는 CPU에서 해당 egress까지의 경로를 요약합니다. AP/RSE/CL0는 설정된 ATU 또는 명시적 bridge로 system_router에 접근합니다. SI1 HIPC shared-memory access는 고정 bridge로 AP view에 연결됩니다. 그 밖의 local device, mailbox와 반대 방향 window는 본문 표에서 구분합니다.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-04-domain-fabric-root { color: #2d3142; font-family: 'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
      #d-04-domain-fabric-root .diagram-container { width:100%;overflow-x:auto;border:1px solid #bfc0c0;border-radius:8px }
      #d-04-domain-fabric-root a { color:#2e5aa8 }
      @media print {
#d-04-domain-fabric-root .diagram-container { overflow-x:visible;border:none }
}</style><marker id="d-04-domain-fabric-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="d-04-domain-fabric-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker><marker id="d-04-domain-fabric-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="48" y="60" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', 'Noto Serif CJK KR', serif" font-size="40" font-weight="400" fill="#2d3142" text-anchor="start">QBox domain address views</text>
<text x="48" y="100" font-family="'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" font-size="14" font-weight="400" fill="#4f5d75" text-anchor="start">Local router와 system_router는 서로 다른 decode view입니다. 실제로 연결된 경로만 따라갑니다.</text>
<path d="M 448,180 L 512,180 Q 520,180 520,188 L 520,288 Q 520,296 528,296 L 608,296" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#d-04-domain-fabric-arrow)"/>
<path d="M 448,308 L 544,308 Q 552,308 552,316 L 552,344 Q 552,352 560,352 L 608,352" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#d-04-domain-fabric-arrow)"/>
<path d="M 448,436 L 512,436 Q 520,436 520,428 L 520,416 Q 520,408 528,408 L 608,408" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#d-04-domain-fabric-arrow)"/>
<path d="M 896,360 L 1008,360" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#d-04-domain-fabric-arrow)"/>
<path d="M 448,564 L 824,564" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#d-04-domain-fabric-arrow)"/>
