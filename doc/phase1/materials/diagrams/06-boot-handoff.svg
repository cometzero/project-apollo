<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="06-boot-handoff-title 06-boot-handoff-desc" id="d-06-boot-handoff-root">
<title id="06-boot-handoff-title">Boot handoff dependencies</title>
<desc id="06-boot-handoff-desc">이 그림은 boot 의존 관계이며 독립 Domain의 정확한 시간 순서가 아닙니다. CL1은 RSE image load와 CL0 power/reset release가 모두 필요합니다. AP의 TF-A와 OP-TEE는 각 exception/security level의 역할을 묶어 표시했습니다.</desc>
