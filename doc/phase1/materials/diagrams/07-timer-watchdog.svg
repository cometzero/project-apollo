<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="07-timer-watchdog-title 07-timer-watchdog-desc" id="d-07-timer-watchdog-root">
<title id="07-timer-watchdog-title">Timer and Watchdog</title>
<desc id="07-timer-watchdog-desc">윗줄은 AP/SI CL1 Generic Timer의 개념 경로입니다. 아랫줄은 AP non-secure Watchdog의 단계적 notification/recovery 경로입니다. SI local, RSE Watchdog과 reset scope는 본문의 별도 표를 따릅니다.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-07-timer-watchdog-root { color: #2d3142; font-family: 'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
      #d-07-timer-watchdog-root .diagram-container { width:100%;overflow-x:auto;border:1px solid #bfc0c0;border-radius:8px }
      #d-07-timer-watchdog-root a { color:#2e5aa8 }
      @media print {
#d-07-timer-watchdog-root .diagram-container { overflow-x:visible;border:none }
}</style><marker id="d-07-timer-watchdog-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="d-07-timer-watchdog-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker><marker id="d-07-timer-watchdog-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="48" y="60" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', 'Noto Serif CJK KR', serif" font-size="40" font-weight="400" fill="#2d3142" text-anchor="start">Timer and Watchdog</text>
<text x="48" y="100" font-family="'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" font-size="14" font-weight="400" fill="#4f5d75" text-anchor="start">Timer는 실행 시점을 알리고, Watchdog은 진행이 멈춘 상황의 복구를 요청합니다.</text>
<text x="48" y="152" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#5a6580" text-anchor="start">GENERIC TIMER</text>
<text x="48" y="424" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#5a6580" text-anchor="start">AP NON-SECURE WATCHDOG</text>
<text x="48" y="616" font-family="'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" font-size="14" font-weight="400" fill="#4f5d75" text-anchor="start">AP recovery: SCP가 AP를 제어하고 RSE가 인증된 image를 reload합니다.</text>
