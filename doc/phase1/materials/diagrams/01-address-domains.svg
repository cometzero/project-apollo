<g data-node="RSE data window">
<rect x="48" y="416" width="352" height="144" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
<rect x="64" y="428" width="88" height="16" rx="2" fill="#f5f5f5"/>
<text x="72" y="440" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" fill="#5a6580" text-anchor="start">LOCAL CPU VIEW</text>
<text x="68" y="468" font-family="'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">RSE data window</text>
<text x="68" y="492" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">NS: 0x60000000..0x6fffffff</text>
<text x="68" y="516" font-family="'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">S: 0x70000000..0x7fffffff</text>
