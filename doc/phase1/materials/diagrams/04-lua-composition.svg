<title id="04-lua-composition-title">Apollo Lua composition</title>
<desc id="04-lua-composition-desc">apollo-qvp.lua는 compatibility wrapper입니다. SoC는 hardware 구조, VP는 image/backend/host policy, board는 외부 주변 장치를 소유합니다. 그림의 화살표는 주요 구성 호출 및 descriptor 생성 관계입니다.</desc>
