      #d-04-lua-composition-root { color: #2d3142; font-family: 'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
      #d-04-lua-composition-root .diagram-container { width:100%;overflow-x:auto;border:1px solid #bfc0c0;border-radius:8px }
      #d-04-lua-composition-root a { color:#2e5aa8 }
      @media print {
#d-04-lua-composition-root .diagram-container { overflow-x:visible;border:none }
