<text x="48" y="100" font-family="'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" font-size="14" font-weight="400" fill="#4f5d75" text-anchor="start">SCMI 요청/응답: payload는 SRAM, notification은 MHU · response IRQ는 선택적이며 polling도 가능합니다.</text>
