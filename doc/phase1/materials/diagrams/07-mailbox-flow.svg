<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="07-mailbox-flow-title 07-mailbox-flow-desc" id="d-07-mailbox-flow-root">
<title id="07-mailbox-flow-title">Mailbox: payload and notification</title>
<desc id="07-mailbox-flow-desc">논리적 request/response를 요약한 그림입니다. Response IRQ는 IENABLED flag에 따라 생략되며 polling도 가능합니다. 방향별 실제 PBX/MBX와 IRQ가 있으며, ACK만으로 SCMI service 완료를 판단하지 않습니다. HIPC/RPMsg는 별도 shared vring protocol이므로 이 SCMI sequence와 동일시하지 않습니다.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-07-mailbox-flow-root { color: #2d3142; font-family: 'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
      #d-07-mailbox-flow-root .diagram-container { width:100%;overflow-x:auto;border:1px solid #bfc0c0;border-radius:8px }
      #d-07-mailbox-flow-root a { color:#2e5aa8 }
      @media print {
#d-07-mailbox-flow-root .diagram-container { overflow-x:visible;border:none }
}</style><marker id="d-07-mailbox-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="d-07-mailbox-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker><marker id="d-07-mailbox-flow-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
