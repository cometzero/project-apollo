<text x="820" y="284" font-family="'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">SCMI / power / reset / safety monitor</text>
</g>
<g data-node="Primary Compute">
<rect x="48" y="432" width="432" height="176" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
<rect x="64" y="444" width="72" height="16" rx="2" fill="#f5f5f5"/>
<text x="72" y="456" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" fill="#5a6580" text-anchor="start">APPLICATION</text>
<text x="68" y="484" font-family="'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">Primary Compute</text>
<text x="68" y="508" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">Cortex-A720AE x4</text>
<text x="68" y="532" font-family="'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">TF-A / OP-TEE / U-Boot / Linux</text>
<text x="68" y="556" font-family="'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">Drivers / product services</text>
</g>
<g data-node="SI CL1">
