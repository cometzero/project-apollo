<text x="1084.0" y="388" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">POWER / RESET</text>
<rect x="648" y="360" width="96" height="16" fill="#f5f5f5"/>
<text x="696.0" y="372" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">AP CONTROL</text>
