<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="06-domain-software-title 06-domain-software-desc" id="d-06-domain-software-root">
<title id="06-domain-software-title">Four firmware domains</title>
<desc id="06-domain-software-desc">화살표는 대표 service와 제어 관계를 요약합니다. RSE의 CL1 image load, AP의 RSE secure service 호출 등은 본문 표에서 보완합니다. CPU 수는 일반 Yocto/runner의 AP4 구성을 기준으로 합니다.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-06-domain-software-root { color: #2d3142; font-family: 'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
      #d-06-domain-software-root .diagram-container { width:100%;overflow-x:auto;border:1px solid #bfc0c0;border-radius:8px }
      #d-06-domain-software-root a { color:#2e5aa8 }
      @media print {
#d-06-domain-software-root .diagram-container { overflow-x:visible;border:none }
}</style><marker id="d-06-domain-software-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="d-06-domain-software-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker><marker id="d-06-domain-software-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="48" y="60" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', 'Noto Serif CJK KR', serif" font-size="40" font-weight="400" fill="#2d3142" text-anchor="start">Four firmware domains</text>
<text x="48" y="100" font-family="'Geist', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif" font-size="14" font-weight="400" fill="#4f5d75" text-anchor="start">SCP는 SI CL0에서 실행합니다. 별도 MCP 또는 SI CL2 execution domain은 현재 구성에 없습니다.</text>
<path d="M 480,224 L 800,224" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#d-06-domain-software-arrow)"/>
<path d="M 1016,336 L 1016,432" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#d-06-domain-software-arrow)"/>
<path d="M 800,288 L 648,288 Q 640,288 640,296 L 640,468 Q 640,476 632,476 L 480,476" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#d-06-domain-software-arrow)"/>
<path d="M 480,556 L 800,556" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#d-06-domain-software-arrow)"/>
<path d="M 264,336 L 264,432" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#d-06-domain-software-arrow)"/>
<rect x="596" y="200" width="88" height="16" fill="#f5f5f5"/>
<text x="640" y="212" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">SCMI BOOT</text>
