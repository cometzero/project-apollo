<rect x="816" y="444" width="56" height="16" rx="2" fill="#f5f5f5"/>
<text x="824" y="456" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" fill="#5a6580" text-anchor="start">REALTIME</text>
