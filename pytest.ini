[pytest]
testpaths =
    qa-tests/unittests
    tests
    scripts/gem5
pythonpath =
    .
    qa-tests
    scripts/validation
    scripts/run
markers =
    domain(name): Apollo execution domain
    category(name): Runtime feature category
    image(scope): Image applicability (bsp-only, product-only, any; default any)
    destructive: Restart QBox before the next runtime test
