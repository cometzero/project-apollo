# Apollo integration candidate; kernel.uname_r requires this workspace's AIB patch.
# The caller mounts the generated kernel repository at /apollo-kernel-repo.
name: apollo-kernel-base
target: apollo-qvp
kernel:
  kernel_package: kernel-apollo
  kernel_version: 6.18.5-1
  uname_r: 6.18.5-rt3-yocto-preempt-rt
  cmdline:
    - console=ttyAMA0
    - earlycon=pl011,0x1a400000
    - efi=runtime
    - systemd.show_status=yes
content:
  repos:
    - id: apollo-kernel
      baseurl: file:///apollo-kernel-repo
      priority: 1
  rpms:
    - openssh-server
  systemd:
    enabled_services:
      - sshd.service
image:
  boot_checks:
    commands:
      - name: success
        cmd: /usr/bin/true
auth:
  # Public demo password: password; use only an isolated local VM.
  root_password: $6$xoLqEUz0cGGJRx01$H3H/bFm0myJPULNMtbSsOFd/2BnHqHkMD92Sfxd.EKM9hXTWSmELG8cf205l6dktomuTcgKGGtGDgtvHVXSWU.
  sshd_config:
    PasswordAuthentication: true
    PermitRootLogin: true
