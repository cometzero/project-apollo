{
  "version": 1,
  "name": "trusted-services",
  "description": "Apollo FVP and QBox Trusted Services PSA conformance validation",
  "compatibility": {
    "backends": ["fvp", "qbox"],
    "images": ["product"]
  },
  "oeqa": {
    "kind": "extended",
    "selectors": [
      "test_00_fvp_boot",
      "test_00_linux_boot",
      "test_80_trusted_services"
    ],
    "timeout_seconds": 7200
  },
  "targets": {
    "fvp": "HSOCSingleSessionFVPTarget",
    "qbox": "QBoxTrustedServicesRunner"
  }
}
