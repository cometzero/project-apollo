# shellcheck shell=bash
# Apollo local build configuration.
#
# This file is the reviewed source of truth for ./local_build.sh. Keeping it
# beside the build modules makes the local-build inputs and their consumers
# one maintained unit. The local build never queries BitBake for these values.
# Use $update-local-build-conf when the active Yocto configuration changes,
# then review and commit the resulting updates.
#
# The ${VAR-default} form preserves explicit environment overrides, including
# an intentionally empty value.

# Machine and firmware platform selection.
MACHINE="${MACHINE-apollo-qvp}"
RD_ASPEN_VARIANT="${RD_ASPEN_VARIANT-cfg2}"
PC_CPUS_COUNT="${PC_CPUS_COUNT-4}"
UBOOT_MACHINE="${UBOOT_MACHINE-apollo_qvp_defconfig}"
LINUX_DEFCONFIG="${LINUX_DEFCONFIG-apollo_qvp_defconfig}"
KERNEL_DEVICETREE="${KERNEL_DEVICETREE-arm/apollo-qvp.dtb}"
BOOTLOADER_LINUX_APPEND="${BOOTLOADER_LINUX_APPEND-cpuidle.governor=menu maxcpus=4 mem=4064M}"
OPTEE_PLATFORM="${OPTEE_PLATFORM-automotive_rd-rdaspen}"
TF_A_PLATFORM="${TF_A_PLATFORM-apollo_qvp}"
TFM_PLATFORM="${TFM_PLATFORM-arm/rse/automotive_rd/apollo-qvp}"
SCP_PLATFORM="${SCP_PLATFORM-apollo-qvp}"
ZEPHYR_BOARD="${ZEPHYR_BOARD-apollo_qvp_safety_island_c1}"

# QBox source and aggregate target selection.
QBOX_APOLLO_BUILD_TARGET="${QBOX_APOLLO_BUILD_TARGET-apollo_fvp_full_system}"
QBOX_CORE_DIR="${QBOX_CORE_DIR-${ROOT_DIR}/hsoc-stack/tools/qbox}"
QBOX_PLATFORM_DIR="${QBOX_PLATFORM_DIR-${ROOT_DIR}/hsoc-stack/tools/qbox-platform}"
QBOX_QEMU_DIR="${QBOX_QEMU_DIR-${ROOT_DIR}/hsoc-stack/tools/qemu}"

# UKI packaging inputs mirrored from the reviewed nexios-image configuration.
EFI_ARCH="${EFI_ARCH-aa64}"
INITRD_ARCHIVE="${INITRD_ARCHIVE-nexios-initramfs-image-apollo-qvp.cpio.gz}"
AUTO_AD_NEXIOS_UKI_A="${AUTO_AD_NEXIOS_UKI_A-auto-ad-nexios-a.efi}"
AUTO_AD_NEXIOS_UKI_B="${AUTO_AD_NEXIOS_UKI_B-auto-ad-nexios-b.efi}"
AUTO_AD_NEXIOS_UKI_CMDLINE_A="${AUTO_AD_NEXIOS_UKI_CMDLINE_A-rootwait root=PARTLABEL=rootro_a ro console=ttyAMA0,115200 cpuidle.governor=menu maxcpus=4 mem=4064M}"
AUTO_AD_NEXIOS_UKI_CMDLINE_B="${AUTO_AD_NEXIOS_UKI_CMDLINE_B-rootwait root=PARTLABEL=rootro_b ro console=ttyAMA0,115200 cpuidle.governor=menu maxcpus=4 mem=4064M}"
UKIFY_CMD="${UKIFY_CMD-ukify build}"
UEFI_SECURE_BOOT="${UEFI_SECURE_BOOT-0}"
UKI_SB_KEY="${UKI_SB_KEY-}"
UKI_SB_CERT="${UKI_SB_CERT-}"
