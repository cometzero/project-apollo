[agents.qbox_dev]
config_file = "./agents/qbox_dev.toml"

[agents.systemc_dev]
config_file = "./agents/systemc_dev.toml"

[agents.test-expert]
config_file = "./agents/test-expert.toml"

[agents.yocto-expert]
